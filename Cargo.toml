[workspace]
resolver = "2"
members = ["crates/napi"]
default-members = ["crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenSFX Authors"]
repository = "https://github.com/nyar-os/OpenSFX"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
# The synthesis domain, the scene-free sfx export entry and the shared sample
# rate live in the media.rs tree. The revision is pinned to a full 40-character
# commit so this repo builds from exactly one upstream source.
media-synthesis = { git = "https://github.com/muse-gpt/ucf.rs.git", rev = "36015678136f9d755ec62651902d2d27f2bb2611" }
media-render = { git = "https://github.com/muse-gpt/ucf.rs.git", rev = "36015678136f9d755ec62651902d2d27f2bb2611", default-features = false, features = ["sfx-export"] }
media-types = { git = "https://github.com/muse-gpt/ucf.rs.git", rev = "36015678136f9d755ec62651902d2d27f2bb2611" }

[profile.release]
lto = true
panic = "abort"
