[workspace]
resolver = "2"
members = ["crates/napi"]
default-members = ["crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenSFX Authors"]
repository = "https://github.com/nyar-os/OpenSFX"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9" }
# The synthesis domain, the scene-free sfx export entry and the shared sample
# rate live in the media.rs tree. The revision is pinned to a full 40-character
# commit so this repo builds from exactly one upstream source.
media-synthesis = { git = "https://github.com/oovm/boost.rs.git", rev = "f7ec3506a8528bcb51d4002aecafc96d7d17051f" }
media-render = { git = "https://github.com/oovm/boost.rs.git", rev = "f7ec3506a8528bcb51d4002aecafc96d7d17051f", default-features = false, features = ["sfx-export"] }
media-types = { git = "https://github.com/oovm/boost.rs.git", rev = "f7ec3506a8528bcb51d4002aecafc96d7d17051f" }

[profile.release]
lto = true
panic = "abort"

