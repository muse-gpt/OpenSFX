[workspace]
resolver = "2"
members = ["crates/opensfx", "crates/napi"]
default-members = ["crates/opensfx", "crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenSFX Authors"]
repository = "https://github.com/nyar-os/OpenSFX"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
# The media library owns WAV writing and the shared sample rate. Local
# development resolves it by path; the published revision to pin is
# 371e65be511acab0cfbc4356d60ccca8384c329c.
media = { path = "../../多媒体研究/media.rs/projects/media/media" }
geometry = { path = "../../多媒体研究/media.rs/projects/geometry/geometry" }
opensfx = { path = "crates/opensfx" }

[profile.release]
lto = true
panic = "abort"
